<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>IELTS Study</title>
<style>
:root{
  --bg:#f3f6fa;--panel:#fff;--text:#142033;--muted:#667085;--line:#e2e8f0;
  --primary:#0f4c5c;--primary2:#176b87;--green:#0f766e;--shadow:0 12px 34px rgba(15,23,42,.07)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Bengali",sans-serif;color:var(--text)}
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(14,116,144,.10),transparent 30rem),
    radial-gradient(circle at 96% 16%,rgba(180,83,9,.07),transparent 27rem),
    linear-gradient(180deg,#f9fbfc 0%,#f2f6f8 50%,#f7f9fb 100%);
  -webkit-tap-highlight-color:transparent
}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:30px 0 54px}
.hero{
  position:relative;overflow:hidden;text-align:center;margin:0 0 22px;padding:36px 22px;border-radius:30px;
  background:linear-gradient(135deg,#0b2633 0%,#0f4c5c 46%,#176b87 100%);
  color:#fff;box-shadow:0 20px 52px rgba(15,43,58,.15);border:1px solid rgba(255,255,255,.12)
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:999px;pointer-events:none}
.hero:before{width:300px;height:300px;right:-115px;top:-180px;background:rgba(255,255,255,.08)}
.hero:after{width:210px;height:210px;left:-110px;bottom:-145px;background:rgba(34,211,238,.11)}
.hero h1{position:relative;margin:0;font-size:clamp(28px,5vw,46px);font-weight:950;letter-spacing:-.035em}
.hero p{position:relative;margin:8px 0 0;color:rgba(255,255,255,.78);font-size:13px;font-weight:700}
.libraryPanel{margin:0 0 20px;padding:18px 20px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.libraryTop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.libraryTitle{display:flex;align-items:center;gap:12px}
.libraryRing{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#4f46e5 100%,#e8ecf5 0);position:relative;flex:0 0 auto}
.libraryRing:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
.libraryRing b{position:relative;z-index:1;font-size:13px;color:#312e81}
.libraryTitle h2{margin:0;font-size:20px;letter-spacing:-.02em}
.libraryTitle p{margin:4px 0 0;color:var(--muted);font-size:12px}
.libraryBtn{border:1px solid #dfe3ee;background:#fff;color:#344054;border-radius:11px;padding:9px 11px;font-weight:800;font-size:12px}
.libraryBtn.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent}
.libraryBtn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.statMini{padding:10px 12px;border-radius:12px;background:#f8f9fc;border:1px solid #edf0f5}
.statMini b{display:block;font-size:16px}
.statMini span{font-size:10px;color:var(--muted);font-weight:700}
.moduleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.moduleCard{
  --accent:#4f46e5;--tint:#eef2ff;position:relative;overflow:hidden;text-align:left;padding:22px 21px 20px;
  border:1px solid var(--line);border-radius:23px;background:linear-gradient(155deg,#fff 20%,var(--tint) 165%);
  min-height:185px;display:flex;flex-direction:column;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
  box-shadow:0 9px 28px rgba(31,41,55,.05)
}
.moduleCard:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--accent),transparent 92%)}
.moduleCard:after{content:"";position:absolute;width:112px;height:112px;border-radius:50%;right:-52px;top:-52px;background:var(--tint);opacity:.85}
.moduleCard:nth-child(1){--accent:#0e7490;--tint:#e8f7fa}
.moduleCard:nth-child(2){--accent:#1d4ed8;--tint:#edf3ff}
.moduleCard:nth-child(3){--accent:#6d3a8a;--tint:#f6effa}
.moduleCard:nth-child(4){--accent:#b7791f;--tint:#fff7e7}
.moduleCard:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(40,42,92,.10)}
.moduleCard:active{transform:translateY(-1px)}
.moduleIcon{position:relative;z-index:1;width:56px;height:56px;border-radius:17px;display:grid;place-items:center;margin-bottom:17px;background:var(--tint);color:var(--accent)}
.moduleIcon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.moduleCard h3{margin:0 0 7px;font-size:21px;color:#172033}
.moduleCard p{margin:0;color:var(--muted);font-size:12px;line-height:1.55;flex:1}
.count{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:13px;border-top:1px solid rgba(148,163,184,.18);color:var(--accent);font-size:12px;font-weight:900}
.count:after{content:"→";width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:var(--tint);font-size:15px}
.breadcrumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:13px 15px;margin-bottom:15px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 24px rgba(31,41,55,.04)}
.crumb{border:0;background:transparent;color:var(--primary);padding:5px 2px;font-weight:800;font-size:13px}
.sep{color:#98a2b3}.current{color:#344054;font-weight:850;font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}
.back{border:0;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:11px 14px;border-radius:12px;font-weight:800;box-shadow:0 7px 16px rgba(15,23,42,.12)}
.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none}
.search:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.11)}
.browserCard{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
.sectionHead h2{margin:0;font-size:25px}.sectionHead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.folderGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.item{
  --itemAccent:#176b87;--itemTint:#edf7f8;position:relative;overflow:hidden;text-align:left;border:1px solid #e3e9ee;
  background:linear-gradient(145deg,#fff 30%,var(--itemTint) 180%);border-radius:18px;padding:17px;min-height:112px;
  transition:transform .14s ease,box-shadow .14s ease;display:flex;gap:14px;align-items:flex-start;box-shadow:0 6px 18px rgba(15,23,42,.03)
}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--itemAccent)}
.item:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,23,42,.075)}
.item:active{transform:none}
.item.listening{--itemAccent:#0e7490;--itemTint:#eaf8fa}.item.reading{--itemAccent:#1d4ed8;--itemTint:#edf3ff}
.item.speaking{--itemAccent:#6d3a8a;--itemTint:#f7effa}.item.writing{--itemAccent:#b7791f;--itemTint:#fff7e8}
.item.folder{--itemAccent:#475569;--itemTint:#f5f7f9}
.ico{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;background:var(--itemTint);color:var(--itemAccent)}
.ico svg{width:25px;height:25px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.itemBody{min-width:0;flex:1;padding-top:1px}
.item h3{margin:0 0 7px;font-size:15px;font-weight:820;line-height:1.4;overflow-wrap:anywhere;color:#172033}
.item p{margin:0;color:#7a8494;font-size:10.5px;line-height:1.45;font-weight:700}
.empty{padding:35px;text-align:center;color:var(--muted)}
.viewer{position:fixed;inset:0;background:#eef2f6;z-index:1000;display:flex;flex-direction:column;contain:layout paint style}
.viewerBar{min-height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#0b2633,#0f4c5c);color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.14);flex:0 0 auto}
.viewerBar button{border:1px solid rgba(255,255,255,.16);background:#1e293b;color:#fff;border-radius:10px;padding:9px 11px;font-weight:800;touch-action:manipulation}
.viewerTitle{flex:1;min-width:0}.viewerTitle b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.viewerTitle small{display:block;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;margin-top:2px}
.viewerFrameWrap{position:relative;flex:1;min-height:0;background:#fff}
.viewer iframe{position:absolute;inset:0;border:0;width:100%;height:100%;background:#fff;display:block}
.viewerBar .fullBtn{background:linear-gradient(135deg,#176b87,#0e7490);border-color:rgba(255,255,255,.2)}
.viewerBar .fullBtn.active{background:#0f766e;border-color:#5eead4}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#64748b;font-size:13px;font-weight:700;z-index:1}
.tip{margin-top:15px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:700px){
  .moduleGrid,.folderGrid{grid-template-columns:1fr}.shell{width:min(100% - 16px,1180px);padding-top:14px}
  .hero{padding:30px 16px;border-radius:24px;margin-bottom:16px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}
  .browserCard{padding:15px}.libraryPanel{padding:16px}.libraryActions{width:100%}.libraryBtn{width:100%}
  .viewerBar{min-height:56px;flex-wrap:nowrap;padding:7px 8px}.viewerTitle small{display:none}.viewerBar button{padding:8px 9px;font-size:11px}
}
@media(hover:none){.moduleCard:hover,.item:hover{transform:none;box-shadow:inherit}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="app">
  <header class="hero"><h1>IELTS Study</h1><p>17 Practice Files</p></header>

  <div class="libraryPanel">
    <div class="libraryTop">
      <div class="libraryTitle">
        <div class="libraryRing"><b>17</b></div>
        <div><h2>Study Library</h2><p>Listening · Reading · Speaking · Writing</p></div>
      </div>
      <div class="libraryActions">
        <button class="libraryBtn primary" id="continueBtn" type="button" disabled>▶ Continue Last</button>
      </div>
    </div>
    <div class="stats">
      <div class="statMini"><b>4</b><span>Sections</span></div>
      <div class="statMini"><b>17</b><span>Files</span></div>
    </div>
  </div>

  <section id="dashboard"><div class="moduleGrid" id="moduleGrid"></div></section>

  <section id="browser" class="hidden">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="toolbar">
      <button class="back" id="backBtn" type="button">← Back</button>
      <input id="search" class="search" autocomplete="off" spellcheck="false" placeholder="Search in this folder...">
    </div>
    <div class="browserCard">
      <div class="sectionHead"><div><h2 id="folderTitle">Folder</h2><p id="folderMeta"></p></div></div>
      <div class="folderGrid" id="folderGrid"></div>
      <div class="empty hidden" id="empty">No matching item found.</div>
    </div>
    <div class="tip">Choose a folder or practice file.</div>
  </section>
</div>

<div id="viewer" class="viewer hidden" aria-hidden="true">
  <div class="viewerBar">
    <button id="closeViewer" type="button">← Folder</button>
    <div class="viewerTitle"><b id="viewerName"></b><small id="viewerPath"></small></div>
    <button id="fullScreenBtn" class="fullBtn" type="button">⛶ Full Screen</button>
  </div>
  <div class="viewerFrameWrap">
    <div id="loader" class="loader">Opening…</div>
    <iframe id="frame" title="Practice" allow="autoplay; clipboard-read; clipboard-write" allowfullscreen loading="eager"></iframe>
  </div>
</div>

<script>
'use strict';

const TREE={type:'folder',name:'root',children:{
  Listening:{type:'folder',name:'Listening',children:{
    'IELTS_All_Words_Practice.html':{type:'file',name:'IELTS_All_Words_Practice.html',path:'Listening/IELTS_All_Words_Practice.html'},
    'IELTS_Listening_Spelling_Practice.html':{type:'file',name:'IELTS_Listening_Spelling_Practice.html',path:'Listening/IELTS_Listening_Spelling_Practice.html'},
    'MY_Grammar_Mistake_Fullscreen.html':{type:'file',name:'MY_Grammar_Mistake_Fullscreen.html',path:'Listening/MY_Grammar_Mistake_Fullscreen.html'}
  },fileCount:3},
  Reading:{type:'folder',name:'Reading',children:{
    'IELTS_Reading Words_Practice.html':{type:'file',name:'IELTS_Reading Words_Practice.html',path:'Reading/IELTS_Reading Words_Practice.html'},
    'MY_Grammar_Mistake.html':{type:'file',name:'MY_Grammar_Mistake.html',path:'Reading/MY_Grammar_Mistake.html'},
    'Reading_Zone.html':{type:'file',name:'Reading_Zone.html',path:'Reading/Reading_Zone.html'}
  },fileCount:3},
  Speaking:{type:'folder',name:'Speaking',children:{
    'IELTS_ Speaking Words Practice.html':{type:'file',name:'IELTS_ Speaking Words Practice.html',path:'Speaking/IELTS_ Speaking Words Practice.html'},
    'IELTS_Speaking_Practice.html':{type:'file',name:'IELTS_Speaking_Practice.html',path:'Speaking/IELTS_Speaking_Practice.html'},
    'Speaking Practice with 30_Topics.html':{type:'file',name:'Speaking Practice with 30_Topics.html',path:'Speaking/Speaking Practice with 30_Topics.html'}
  },fileCount:3},
  Writing:{type:'folder',name:'Writing',children:{
    'Task- 1':{type:'folder',name:'Task- 1',children:{
      'All_Grammar_Practice.html':{type:'file',name:'All_Grammar_Practice.html',path:'Writing/Task- 1/All_Grammar_Practice.html'},
      'IELTS_Task1_Words_Practice.html':{type:'file',name:'IELTS_Task1_Words_Practice.html',path:'Writing/Task- 1/IELTS_Task1_Words_Practice.html'},
      'Task-1_All Sentence_Making.html':{type:'file',name:'Task-1_All Sentence_Making.html',path:'Writing/Task- 1/Task-1_All Sentence_Making.html'}
    },fileCount:3},
    'Task- 2':{type:'folder',name:'Task- 2',children:{
      'IELTS_Ideas_Generation.html':{type:'file',name:'IELTS_Ideas_Generation.html',path:'Writing/Task- 2/IELTS_Ideas_Generation.html'},
      'IELTS_Writing Words_Practice.html':{type:'file',name:'IELTS_Writing Words_Practice.html',path:'Writing/Task- 2/IELTS_Writing Words_Practice.html'},
      'Sentence Making Practice.html':{type:'file',name:'Sentence Making Practice.html',path:'Writing/Task- 2/Sentence Making Practice.html'},
      'Task-2 Grammar Practice.html':{type:'file',name:'Task-2 Grammar Practice.html',path:'Writing/Task- 2/Task-2 Grammar Practice.html'},
      'Writing Test.html':{type:'file',name:'Writing Test.html',path:'Writing/Task- 2/Writing Test.html'}
    },fileCount:5}
  },fileCount:8}
}};

const $=id=>document.getElementById(id);
const moduleGrid=$('moduleGrid'),folderGrid=$('folderGrid'),frame=$('frame'),viewer=$('viewer'),loader=$('loader');
let currentPath=[],currentFile=null,loadToken=0;

const ICONS={
 listening:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-2v-7h4M4 12v7h4v-7H4"/></svg>',
 reading:'<svg viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22V5.5ZM20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22V5.5Z"/></svg>',
 speaking:'<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>',
 writing:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4M4 20h16"/></svg>',
 folder:'<svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3V7Z"/></svg>',
 file:'<svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6V2Z"/><path d="M14 2v5h5M9 12h6M9 16h6"/></svg>'
};

const getNode=path=>path.reduce((n,k)=>n?.children?.[k],TREE);
const moduleClass=name=>name.toLowerCase();

function renderDashboard(){
  currentPath=[];
  $('dashboard').classList.remove('hidden');
  $('browser').classList.add('hidden');
  moduleGrid.innerHTML='';
  Object.entries(TREE.children).forEach(([name,node])=>{
    const b=document.createElement('button');
    b.className='moduleCard';
    b.type='button';
    b.innerHTML=`<div class="moduleIcon">${ICONS[moduleClass(name)]}</div>
      <h3>${name}</h3>
      <p>${name==='Writing'?'Task 1 and Task 2 practice':name+' practice materials'}</p>
      <div class="count"><span>${node.fileCount} files</span></div>`;
    b.addEventListener('click',()=>openFolder([name]));
    moduleGrid.appendChild(b);
  });
}

function openFolder(path){
  currentPath=path.slice();
  $('dashboard').classList.add('hidden');
  $('browser').classList.remove('hidden');
  $('search').value='';
  renderFolder();
  window.scrollTo({top:0,behavior:'auto'});
}

function renderBreadcrumb(){
  const el=$('breadcrumb');
  el.innerHTML='';
  const home=document.createElement('button');
  home.className='crumb';home.type='button';home.textContent='Home';
  home.onclick=renderDashboard;
  el.appendChild(home);
  currentPath.forEach((part,i)=>{
    const sep=document.createElement('span');sep.className='sep';sep.textContent='›';el.appendChild(sep);
    if(i===currentPath.length-1){
      const c=document.createElement('span');c.className='current';c.textContent=part;el.appendChild(c);
    }else{
      const c=document.createElement('button');c.className='crumb';c.type='button';c.textContent=part;
      c.onclick=()=>openFolder(currentPath.slice(0,i+1));el.appendChild(c);
    }
  });
}

function renderFolder(){
  const node=getNode(currentPath);
  if(!node){renderDashboard();return}
  renderBreadcrumb();
  $('folderTitle').textContent=node.name;
  const items=Object.entries(node.children||{});
  $('folderMeta').textContent=`${items.length} item${items.length===1?'':'s'}`;
  const term=$('search').value.trim().toLowerCase();
  folderGrid.innerHTML='';
  let shown=0;

  items.forEach(([name,item])=>{
    if(term && !name.toLowerCase().includes(term)) return;
    shown++;
    const b=document.createElement('button');
    const top=currentPath[0]?.toLowerCase() || 'folder';
    b.className=`item ${item.type==='folder'?'folder':top}`;
    b.type='button';
    b.innerHTML=`<div class="ico">${ICONS[item.type==='folder'?'folder':'file']}</div>
      <div class="itemBody"><h3>${name}</h3><p>${item.type==='folder'?(item.fileCount+' files'):'HTML practice file'}</p></div>`;
    b.onclick=()=> item.type==='folder' ? openFolder([...currentPath,name]) : openFile(item);
    folderGrid.appendChild(b);
  });
  $('empty').classList.toggle('hidden',shown!==0);
}

function openFile(item){
  currentFile=item;
  const token=++loadToken;
  $('viewerName').textContent=item.name;
  $('viewerPath').textContent=item.path;
  loader.classList.remove('hidden');
  viewer.classList.remove('hidden');
  viewer.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';

  const onLoad=()=>{
    if(token!==loadToken) return;
    loader.classList.add('hidden');
    frame.removeEventListener('load',onLoad);
  };
  frame.addEventListener('load',onLoad);
  frame.src='./'+item.path;

  try{
    localStorage.setItem('ielts-last-file',JSON.stringify(item));
    $('continueBtn').disabled=false;
  }catch(e){}
}

function closeViewer(){
  ++loadToken;
  viewer.classList.add('hidden');
  viewer.setAttribute('aria-hidden','true');
  frame.src='about:blank';
  loader.classList.add('hidden');
  document.body.style.overflow='';
  currentFile=null;
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      await viewer.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
}

$('backBtn').onclick=()=>{
  if(currentPath.length<=1) renderDashboard();
  else openFolder(currentPath.slice(0,-1));
};
$('search').addEventListener('input',renderFolder);
$('closeViewer').onclick=closeViewer;
$('fullScreenBtn').onclick=toggleFullscreen;
document.addEventListener('fullscreenchange',()=>{
  const active=!!document.fullscreenElement;
  $('fullScreenBtn').classList.toggle('active',active);
  $('fullScreenBtn').textContent=active?'⤢ Exit Full Screen':'⛶ Full Screen';
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !viewer.classList.contains('hidden') && !document.fullscreenElement) closeViewer();
});

(function restoreLast(){
  try{
    const last=JSON.parse(localStorage.getItem('ielts-last-file')||'null');
    if(last?.path && last?.name){
      $('continueBtn').disabled=false;
      $('continueBtn').onclick=()=>openFile(last);
    }
  }catch(e){}
})();

renderDashboard();
</script>
</body>
</html>
